name: Kunlik post - Shokirov School

on:
  schedule:
    # 03:00 UTC = 08:00 Toshkent/Farg'ona vaqti (UTC+5)
    - cron: "0 3 * * *"
  workflow_dispatch: {}   # "Run workflow" tugmasi orqali qo'lda ham ishga tushirish mumkin

jobs:
  send-post:
    runs-on: ubuntu-latest
    steps:
      - name: Kodni yuklab olish
        uses: actions/checkout@v4

      - name: Python o'rnatish
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Kutubxonalarni o'rnatish
        run: pip install -r requirements.txt

      - name: Postni yuborish
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
        run: python bot.py
